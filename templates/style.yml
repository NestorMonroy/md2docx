# =============================================================================
# DOCX STYLE MAPPING CONFIGURATION
# =============================================================================
# This file maps Markdown/HTML elements to Word styles defined in the template.
# All style names must exist in plantilla_corporativa.docx

styles:
  # Heading styles (h1-h6)
  headings:
    h1: "Heading 1"
    h2: "Heading 2"
    h3: "Heading 3"
    h4: "Heading 4"
    h5: "Heading 5"
    h6: "Heading 6"

  # Paragraph styles
  paragraph: "Normal"

  # Code styles
  code_block: "Code"
  inline_code: "Intense Emphasis"

  # List styles
  bullet_list: "List Bullet"
  number_list: "List Number"

  # Table style
  table: "Table Grid"

  # Quote style
  blockquote: "Quote"

  # Additional styles (optional)
  caption: "Caption"
  title: "Title"
  subtitle: "Subtitle"

# =============================================================================
# BEHAVIOR CONFIGURATION
# =============================================================================
# Control how certain elements are converted

behaviors:
  # Convert <hr> to page breaks (true) or horizontal lines (false)
  hr_as_page_break: true

  # Preserve empty paragraphs
  keep_empty_paragraphs: false

  # Process HTML comments
  process_comments: false

# =============================================================================
# IMAGE CONFIGURATION
# =============================================================================

images:
  # Default width for images (in inches)
  default_width_inches: 5.5

  # Maximum width (prevents oversized images)
  max_width_inches: 6.5

  # Default height if specified (in inches, null for auto)
  default_height_inches: null

  # Image search paths (relative to project root)
  search_paths:
    - "docs/images"
    - "docs/assets"
    - "images"

  # Fallback behavior when image not found
  show_placeholder: true
  placeholder_text: "[Image not found: {src}]"

# =============================================================================
# TABLE CONFIGURATION
# =============================================================================

tables:
  # Auto-fit table to page width
  autofit: true

  # Apply header formatting to first row
  style_first_row_as_header: true

  # Center-align header cells
  center_align_headers: true

  # Add borders to all cells (if style doesn't define them)
  add_default_borders: true

# =============================================================================
# LIST CONFIGURATION
# =============================================================================

lists:
  # Maximum nesting level for lists
  max_nesting_level: 5

  # Auto-indent nested lists
  auto_indent_nested: true

  # Indent size for each level (in points)
  indent_per_level: 18

# =============================================================================
# CODE BLOCK CONFIGURATION
# =============================================================================

code:
  # Font name for code blocks
  font_name: "Courier New"

  # Font size for code blocks (in points)
  font_size: 9

  # Background color for code blocks (RGB hex)
  background_color: "#F5F5F5"

  # Preserve whitespace and line breaks
  preserve_formatting: true

# =============================================================================
# LINK CONFIGURATION
# =============================================================================

links:
  # Show URL after link text
  show_url: true

  # URL format: inline, footnote, or hidden
  url_format: "inline"  # "[text](url)" -> "text (url)"

  # Apply hyperlink style
  use_hyperlink_style: true

  # Color for links (RGB hex, null for default)
  link_color: null

# =============================================================================
# DOCUMENT METADATA
# =============================================================================
# This metadata can be used by the pipeline for document properties

metadata:
  # Auto-update document properties
  update_properties: false

  # Default author (if not specified)
  default_author: "Generated by MD2DOCX Pipeline"

  # Default subject
  default_subject: "Document"

  # Keywords (comma-separated)
  default_keywords: "markdown, docx, automated"

# =============================================================================
# CONVERSION OPTIONS
# =============================================================================

options:
  # Verbose output during conversion
  verbose: false

  # Strict mode (fail on any error)
  strict_mode: false

  # Validate output after conversion
  validate_output: true

  # Generate conversion report
  generate_report: false

  # Report output path
  report_path: "builds/conversion_report.txt"

# =============================================================================
# CUSTOM MAPPINGS (OPTIONAL)
# =============================================================================
# Define custom element-to-style mappings for non-standard HTML

custom_mappings:
  # Example: Map <div class="note"> to a custom style
  # "div.note": "Note Style"
  # "span.highlight": "Highlight"